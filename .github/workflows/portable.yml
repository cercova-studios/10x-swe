name: Portable knowledge tools
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Source build and idempotent setup
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          ./knowledge plan --prefix "$RUNNER_TEMP/knowledge tools"
          ./knowledge setup --prefix "$RUNNER_TEMP/knowledge tools"
          ./knowledge setup --prefix "$RUNNER_TEMP/knowledge tools"
      - name: Independent pipes, review gates and read-only intake
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/knowledge tools/env.sh"
          export PYTHONPATH="$PWD/plugins/knowledge/lib"
          export PYTHONDONTWRITEBYTECODE=1
          RUNTIME="$RUNNER_TEMP/knowledge tools/runtimes/source-insights/bin/python"
          "$RUNTIME" -m unittest discover -s tests -p 'test_*.py' -v
          "$RUNTIME" -m unittest discover -s plugins/knowledge/tests -v
          "$RUNTIME" tests/check_concurrent_graph.py
          "$RUNTIME" tests/check_distribution.py
          "$RUNTIME" plugins/10x-swe/skills/turnstile-spin/tests/test_helpers.py
          "$RUNTIME" plugins/10x-swe/skills/ghidra/tests/test_wrapper.py
          "$RUNTIME" plugins/10x-swe/skills/tmux/tests/test_private_socket.py
          "$RUNTIME" plugins/10x-swe/skills/web-research/tests/test_websearch.py
          "$RUNTIME" plugins/knowledge/skills/skill-graph/scripts/test_graph.py
          "$RUNTIME" plugins/knowledge/skills/skill-graph/scripts/test_concepts.py
          "$RUNTIME" plugins/knowledge/skills/session-search/tests/check.py
          "$RUNTIME" plugins/knowledge/skills/source-insights/scripts/check_workflow.py
          "$RUNTIME" tests/acceptance.py "$RUNNER_TEMP/knowledge tools"
          ./knowledge doctor --prefix "$RUNNER_TEMP/knowledge tools"
      - name: Install pinned EPUB test prerequisite
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              ASSET=pandoc-3.12.1-linux-amd64.tar.gz
              SHA256=d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8
              ;;
            macOS/ARM64)
              ASSET=pandoc-3.12.1-arm64-macOS.zip
              SHA256=c2146cf33a583f3ac93eccddf1bb662371d5cfcce1aad1c87ad860cca1435d46
              ;;
            *) echo "Unsupported CI Pandoc platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          ARCHIVE="$RUNNER_TEMP/$ASSET"
          curl --fail --location --retry 3 "https://github.com/jgm/pandoc/releases/download/3.12.1/$ASSET" --output "$ARCHIVE"
          python3 - "$ARCHIVE" "$SHA256" <<'PY'
          import hashlib, pathlib, sys
          actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit('Pandoc archive checksum mismatch')
          PY
          mkdir "$RUNNER_TEMP/pandoc"
          if [[ "$ASSET" == *.zip ]]; then
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/pandoc"
          else
            tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/pandoc"
          fi
          PANDOC=$(find "$RUNNER_TEMP/pandoc" -type f -name pandoc)
          "$PANDOC" --version
          dirname "$PANDOC" >> "$GITHUB_PATH"
      - name: Rust and Go regressions
        shell: bash
        run: |
          set -euo pipefail
          for PROJECT in plugins/knowledge/skills/skill-graph/scripts/search-core plugins/knowledge/tools/bkd plugins/knowledge/tools/distiller; do
            cargo test --locked --release --manifest-path "$PROJECT/Cargo.toml" --target-dir "$RUNNER_TEMP/knowledge tools/build/rust"
          done
          cd plugins/knowledge/tools/insights
          go test ./...
          go vet ./...
