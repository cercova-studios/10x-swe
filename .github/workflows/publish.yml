name: Publish OpenCode package
# Runs only when commits land on main (a merged pull request), never on PRs or branches.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-opencode-package
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@cercova-studios'
      - name: Generated adapters match their canonical sources
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/hosts.py check
      - name: Type-check and test the package entry
        run: |
          npm ci --prefix plugins/10x-swe --ignore-scripts --no-audit --no-fund
          npm run --prefix plugins/10x-swe typecheck
          node --test tests/test_opencode.mjs
      - name: Skip if this version is already published
        id: version
        working-directory: plugins/10x-swe
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Versions are immutable: publish only when this one is new. Any error other
          # than "not found" fails the job instead of being read as "unpublished".
          if out=$(npm view "$name@$version" version 2>&1); then
            if [ "$out" = "$version" ]; then
              echo "$name@$version is already published; bump the plugin version to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 <<<"$out"; then
            echo "$out" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        working-directory: plugins/10x-swe
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --dry-run --ignore-scripts
          npm publish --ignore-scripts
          echo "Published $VERSION" >> "$GITHUB_STEP_SUMMARY"
