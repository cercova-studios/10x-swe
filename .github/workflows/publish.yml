name: Publish OpenCode package
# Runs only when commits land on main (a merged pull request), never on PRs or branches.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-opencode-package
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Generated adapters match their canonical sources
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/hosts.py check
      - name: Type-check and test the package entry
        run: |
          bun install --cwd plugins/10x-swe --frozen-lockfile --ignore-scripts
          bun run --cwd plugins/10x-swe typecheck
          bun test ./tests/test_opencode.mjs
      - name: Skip if this version is already published
        id: version
        working-directory: plugins/10x-swe
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Versions are immutable: publish only when this one is new. Ask the registry
          # directly so the decision rests on HTTP status codes, not CLI error text;
          # any status other than 200 or 404 fails the job.
          meta=$(mktemp)
          code=$(curl -sS -o "$meta" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "$REGISTRY/${name/\//%2f}")
          case "$code" in
            200)
              if jq -e --arg v "$version" '.versions[$v]' "$meta" >/dev/null; then
                echo "$name@$version is already published; bump the plugin version to release."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
            404) ;;
            *) echo "Registry returned HTTP $code for $name" >&2; exit 1 ;;
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        working-directory: plugins/10x-swe
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun pm pack --dry-run --ignore-scripts
          bun publish --registry "$REGISTRY" --ignore-scripts
          echo "Published $VERSION" >> "$GITHUB_STEP_SUMMARY"
