[package]
name = "distiller"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Rust CLI to extract readable markdown from webpages"

[features]
default = []
browser = ["dep:chromiumoxide", "dep:futures-util"]

[dependencies]
anyhow = "1"
base64 = "0.22"
fontdue = "0.9"
png = "0.18"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
chromiumoxide = { version = "0.9.1", optional = true }
encoding_rs = "0.8"
ego-tree = "0.10"
futures-util = { version = "0.3", optional = true }
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
url = "2"
quick-xml = "0.38"

[dev-dependencies]
pretty_assertions = "1"
