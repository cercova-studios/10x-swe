<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookmarkDrop</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<div class="window">
<aside><div class="brand">bookmarkdrop</div><label class="caption" for="source">Library</label><select id="source" size="5" aria-label="Bookmark source"><option value="" selected>All bookmarks</option><option value="instapaper">Instapaper</option><option value="raindrop">Raindrop</option><option value="neon">Neon</option><option value="manual">Captured</option></select><div class="sidebar-bottom"><button id="graph" type="button">Relationships</button><label class="knowledge"><input id="knowledge" type="checkbox"> Knowledge</label></div></aside>
<main>
<header class="toolbar"><h1 id="location">All bookmarks</h1><div class="tools"><button id="add" class="icon" type="button" title="Capture link" aria-label="Capture link">＋</button><button id="peek" class="icon" type="button" title="Quick Look (Space)" aria-label="Quick Look">◉</button><label class="sr-only" for="kind">Bookmark type</label><select id="kind"><option value="">All types</option><option value="blog">Blog</option><option value="article">Article</option><option value="video">Video</option><option value="paper">Research paper</option><option value="documentation">Documentation</option><option value="book">Book</option><option value="other">Other</option></select><form id="search"><label class="sr-only" for="query">Search bookmarks</label><input id="query" type="search" placeholder="Search bookmarks" autocomplete="off"><button class="sr-only">Search</button></form></div></header>
<section id="drop" aria-label="Bookmark files and link drop area" tabindex="0"><div id="empty" hidden><span class="empty-icon" aria-hidden="true">↧</span><p>Drop a link here</p><small>or paste a URL · nothing saves until you review</small></div><div id="results" aria-label="Bookmarks"></div><section id="map" hidden><p id="graphstatus"></p><canvas width="1100" height="650" aria-label="Relationship graph; keyboard node list follows"></canvas><div class="graph-pages"><button id="prev" type="button">Previous graph page</button><button id="next" type="button">Next graph page</button></div><ul id="nodes"></ul></section></section>
<footer><p id="status" role="status" aria-live="polite"></p><div class="paging"><button id="back" class="icon" aria-label="Previous bookmarks" title="Previous bookmarks">‹</button><span id="pagecount"></span><button id="forward" class="icon" aria-label="Next bookmarks" title="Next bookmarks">›</button></div></footer>
</main></div>
<dialog id="capture"><form id="save"><div class="dialog-head"><h2>Capture link</h2><button class="icon" type="button" data-close="capture" aria-label="Close capture" title="Close">×</button></div><label for="url">URL</label><input id="url" type="url" required placeholder="https://"><label for="title">Public title</label><input id="title" placeholder="Optional"><label for="savekind">Type</label><select id="savekind"><option value="">Detect from URL</option><option value="blog">Blog</option><option value="article">Article</option><option value="video">Video</option><option value="paper">Research paper</option><option value="documentation">Documentation</option><option value="book">Book</option><option value="other">Other</option></select><label class="confirmation"><input id="confirm" type="checkbox" required> Publish this URL and title on {{PUBLIC_SITE}}</label><p id="capturestatus" role="status"></p><button id="publish" type="submit">Publish bookmark</button></form></dialog>
<dialog id="quicklook"><div class="preview-head"><div><h2 id="previewtitle"></h2><a id="original" target="_blank" rel="noopener noreferrer">Open original ↗</a></div><div class="tools"><button id="webmode" class="icon" aria-label="Web preview" title="Web preview" aria-pressed="true">◉</button><button id="readermode" class="icon" aria-label="Reader mode" title="Convert public page to reader mode" aria-pressed="false">Aa</button><button id="notesmode" class="icon" aria-label="Saved notes and evidence" title="Saved notes and evidence" aria-pressed="false">≡</button><button class="icon" data-close="quicklook" aria-label="Close Quick Look" title="Close (Escape)">×</button></div></div><p id="previewstatus" role="status">Sites may block embedding. Use Reader or Open original if the frame is blank.</p><iframe id="webpreview" title="Bookmark web preview" sandbox="" referrerpolicy="no-referrer"></iframe><article id="reader" hidden></article><article id="notes" hidden></article></dialog>
</body></html>
