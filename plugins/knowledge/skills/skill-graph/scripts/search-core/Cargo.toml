[package]
name = "skill-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded local skill discovery and scan-gated remote loading"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
url = "2.5.8"
tempfile = "3.27.0"
libc = "0.2.190"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
crossterm = "0.29.0"

[profile.release]
strip = true
lto = "thin"
